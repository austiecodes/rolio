[package]
name = "rolio-server"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# Offline, pinned local model; artifacts are installed explicitly.
embedding-local = ["dep:llama-cpp-2", "dep:sha2"]
# The PostgreSQL storage adapter. Selected explicitly by server configuration.
store-postgres = ["dep:sqlx", "dep:sha2"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
rolio-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[[bin]]
name = "rolio-server"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
